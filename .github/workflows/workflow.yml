name: Build OCaml 5 server package
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for Ubuntu 26.04
        run: ./scripts/build-deb.sh --docker
      - uses: actions/upload-artifact@v4
        with:
          name: mldonkey-server-ubuntu26.04
          path: build-deb/*
