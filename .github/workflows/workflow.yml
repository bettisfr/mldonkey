name: Build OCaml 5 server package
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf m4 pkg-config debhelper \
            ocaml ocaml-findlib camlp4 libcamlp-streams-ocaml-dev libnum-ocaml-dev \
            zlib1g-dev libbz2-dev libgd-dev libmagic-dev
      - name: Build for Ubuntu 26.04
        run: ./scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mldonkey-server-ubuntu26.04
          path: build-deb/*
